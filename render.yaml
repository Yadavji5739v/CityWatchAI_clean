services:
  - type: web
    name: citywatch-ai-api
    runtime: python
    plan: standard
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: CITYWATCH_AUTO_MIGRATE
        value: "false"
      - key: CITYWATCH_SEED_DEMO_ACCOUNTS
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "8"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: evidence
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CITYWATCH_ROAD_MODEL_PATH
        value: models/road_damage_5class_model.keras
